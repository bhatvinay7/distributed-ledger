  http-server:
    container_name: http-server
    build:
      context: .
      dockerfile: apps/http-server/dockerfile.dev.yaml
    ports:
      - "3002:3002"
    env_file:
      -  ./apps/http-server/.env

    networks:
      - payit
    depends_on:
      - kurrent1
      # - kurrent2
      # - kurrent3    
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 1G  
  projection-worker:
    container_name: projection-worker
    build:
      context: .
      dockerfile: apps/projection-worker/dockerfile.dev.yaml
    ports:
      - "3004:3004"
    env_file:
      -  ./apps/projection-worker/.env
    networks:
      - payit
    deploy:
     resources:
       limits:
         cpus: '0.25'
         memory: 1G  

  transaction-worker:
    container_name: transaction-worker
    build:
      context: .
      dockerfile: apps/transaction-worker/dockerfile.dev.yaml
    ports:
      - "3005:3005"
    env_file:
      -  ./apps/transaction-worker/.env
    networks:
      - payit
    depends_on:
      - kurrent1
      # - kurrent2
      # - kurrent3  
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 1G         
